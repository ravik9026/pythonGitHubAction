name: checkout application code and Build wheel on development push

on:
  push:
    branches: [development]
  workflow_dispatch: {}

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show checked-out files
        run: |
          echo "Repository checked out on runner:" 
          ls -la

  build:
    needs: checkout
    if: ${{ needs.checkout.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (fresh in build job)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "${HOME}/.local/bin" >> $GITHUB_PATH
      
      - name: Install project dependencies (Poetry)
        run: |
          poetry config virtualenvs.create false
          poetry install --without dev --no-interaction --no-ansi

      - name: Build wheel
        run: |
          poetry build -f wheel

      - name: Show dist contents
        run: |
          echo "dist contents:" 
          ls -la dist || true

      - name: Upload wheel as workflow artifact (for publish job)
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  publish:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: downloaded-wheel

      - name: Show downloaded files
        run: |
          ls -la downloaded-wheel || true