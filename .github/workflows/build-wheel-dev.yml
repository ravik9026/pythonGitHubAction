name: checkout application code and Build wheel on development push

on:
  push:
    branches: [development]
  workflow_dispatch: {}

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show checked-out files
        run: |
          echo "Repository checked out on runner:" 
          ls -la

  build:
    needs: checkout
    if: ${{ needs.checkout.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (fresh in build job)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "${HOME}/.local/bin" >> $GITHUB_PATH
      
      - name: Install project dependencies (Poetry)
        run: |
          poetry config virtualenvs.create false
          poetry install --without dev --no-interaction --no-ansi

      - name: Build wheel
        run: |
          poetry build -f wheel

      - name: Show dist contents
        run: |
          echo "dist contents:" 
          ls -la dist || true

      - name: Upload wheel as workflow artifact (for publish job)
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  publish:
    needs: build
    if: ${{ needs.build.result == 'success' && (secrets.ARTIFACTORY_URL != '' && secrets.ARTIFACTORY_REPO != '' && (secrets.ARTIFACTORY_USERNAME != '' || secrets.ARTIFACTORY_API_KEY != '')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: downloaded-wheel

      - name: Show downloaded files
        run: |
          ls -la downloaded-wheel || true

      - name: Upload wheel to JFrog Artifactory
        env:
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_REPO: ${{ secrets.ARTIFACTORY_REPO }}
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
          ARTIFACTORY_API_KEY: ${{ secrets.ARTIFACTORY_API_KEY }}
        run: |
          set -euo pipefail
          WHEEL_FILE=$(ls downloaded-wheel/*.whl | head -n 1 || true)
          if [ -z "$WHEEL_FILE" ]; then
            echo "No wheel file found to upload" >&2
            exit 1
          fi
          WHEEL_BASENAME=$(basename "$WHEEL_FILE")

          # Upload and check HTTP status
          if [ -n "${ARTIFACTORY_API_KEY:-}" ]; then
            echo "Uploading $WHEEL_BASENAME to $ARTIFACTORY_REPO in Artifactory using API key"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "X-JFrog-Art-Api: ${ARTIFACTORY_API_KEY}" -T "$WHEEL_FILE" "$ARTIFACTORY_URL/artifactory/${ARTIFACTORY_REPO}/${WHEEL_BASENAME}")
          else
            echo "Uploading $WHEEL_BASENAME to $ARTIFACTORY_REPO in Artifactory using username/password"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "${ARTIFACTORY_USERNAME}:${ARTIFACTORY_PASSWORD}" -T "$WHEEL_FILE" "$ARTIFACTORY_URL/artifactory/${ARTIFACTORY_REPO}/${WHEEL_BASENAME}")
          fi

          echo "Artifactory returned HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Upload failed with status $HTTP_STATUS" >&2
            exit 1
          fi

