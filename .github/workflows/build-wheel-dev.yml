name: checkout application code and Build wheel on development push

on:
  push:
    branches: [development]
  workflow_dispatch: {}

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show checked-out files
        run: |
          echo "Repository checked out on runner:" 
          ls -la

  build:
    needs: checkout
    if: ${{ needs.checkout.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (fresh in build job)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "${HOME}/.local/bin" >> $GITHUB_PATH
      
      - name: Install project dependencies (Poetry)
        run: |
          poetry config virtualenvs.create false
          poetry install --without dev --no-interaction --no-ansi

      - name: Build wheel
        run: |
          poetry build -f wheel

      - name: Show dist contents
        run: |
          echo "dist contents:" 
          ls -la dist || true

      - name: Upload wheel as workflow artifact (for publish job)
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

      - name: Check Artifactory credentials
        id: check-creds
        if: always()
        run: |
          if [ -n "${{ secrets.ARTIFACTORY_API_KEY }}" ]; then
            echo "can_publish=true" >> $GITHUB_OUTPUT
            echo "use_api_key=true" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.ARTIFACTORY_USERNAME }}" ] && [ -n "${{ secrets.ARTIFACTORY_PASSWORD }}" ]; then
            echo "can_publish=true" >> $GITHUB_OUTPUT
            echo "use_api_key=false" >> $GITHUB_OUTPUT
          else
            echo "can_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip publish (missing Artifactory credentials)
        if: ${{ steps.check-creds.outputs.can_publish == 'false' }}
        run: |
          echo "Skipping publish: set ARTIFACTORY_API_KEY or ARTIFACTORY_USERNAME and ARTIFACTORY_PASSWORD in repository secrets"

      - name: Validate Artifactory access (API token)
        if: ${{ steps.check-creds.outputs.use_api_key == 'true' }}
        env:
          ARTIFACTORY_API_KEY: ${{ secrets.ARTIFACTORY_API_KEY }}
        run: |
          set -euo pipefail
          echo "Checking ARTIFACTORY_API_KEY appears set (length): ${#ARTIFACTORY_API_KEY}"

          echo "Checking Artifactory server (no auth) via /api/system/ping..."
          ping_status=$(curl -s -o /dev/null -w "%{http_code}" https://ravik9026.jfrog.io/artifactory/api/system/ping || true)
          echo "System ping HTTP status: $ping_status"

          repo_api='https://ravik9026.jfrog.io/artifactory/api/storage/altera-val-pypi-local?list=1'

          echo "Trying Artifactory access using X-JFrog-Art-Api header to $repo_api ..."
          status_header=$(curl -s -o /tmp/resp_header -w "%{http_code}" -H "X-JFrog-Art-Api: ${ARTIFACTORY_API_KEY}" "${repo_api}" || true)
          echo "Header auth HTTP status: $status_header"
          if [[ "$status_header" -ge 200 && "$status_header" -lt 400 ]]; then
            echo "Artifactory reachable with X-JFrog-Art-Api header; sample response:"
            head -c 800 /tmp/resp_header || true
            echo
            exit 0
          else
            echo "Header response preview:"
            head -c 800 /tmp/resp_header || true
            echo
          fi

          echo "Header auth failed (HTTP $status_header). Trying basic auth with __token as username to $repo_api ..."
          status_basic=$(curl -s -o /tmp/resp_basic -w "%{http_code}" -u __token:${ARTIFACTORY_API_KEY} "${repo_api}" || true)
          echo "Basic auth HTTP status: $status_basic"
          if [[ "$status_basic" -ge 200 && "$status_basic" -lt 400 ]]; then
            echo "Artifactory reachable with basic auth (__token); sample response:"
            head -c 800 /tmp/resp_basic || true
            echo
            exit 0
          else
            echo "Basic response preview:"
            head -c 800 /tmp/resp_basic || true
            echo
          fi

          echo "Trying Authorization: Bearer <token> header as an alternative..."
          status_bearer=$(curl -s -o /tmp/resp_bearer -w "%{http_code}" -H "Authorization: Bearer ${ARTIFACTORY_API_KEY}" "${repo_api}" || true)
          echo "Bearer auth HTTP status: $status_bearer"
          if [[ "$status_bearer" -ge 200 && "$status_bearer" -lt 400 ]]; then
            echo "Artifactory reachable with Bearer token; sample response:"
            head -c 800 /tmp/resp_bearer || true
            echo
            exit 0
          else
            echo "Bearer response preview:"
            head -c 800 /tmp/resp_bearer || true
            echo
          fi

          echo "All authentication attempts failed (header: $status_header, basic: $status_basic, bearer: $status_bearer)" >&2
          echo "Possible causes: token value is wrong, token lacks permission to list the target repository, or the repository path differs." >&2
          echo "Next steps: verify the token and that it has 'deploy' permission on 'altera-val-pypi-local', or try a user API key instead." >&2
          exit 1

      - name: Validate Artifactory access (username/password)
        if: ${{ steps.check-creds.outputs.use_api_key == 'false' }}
        env:
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Checking Artifactory server (no auth) via /api/system/ping..."
          ping_status=$(curl -s -o /dev/null -w "%{http_code}" https://ravik9026.jfrog.io/artifactory/api/system/ping || true)
          echo "System ping HTTP status: $ping_status"

          repo_api='https://ravik9026.jfrog.io/artifactory/api/storage/altera-val-pypi-local?list=1'

          echo "Trying Artifactory access using username/password to $repo_api ..."
          status=$(curl -s -o /tmp/resp_up -w "%{http_code}" -u ${ARTIFACTORY_USERNAME}:${ARTIFACTORY_PASSWORD} "${repo_api}" || true)
          echo "HTTP status: $status"
          if [[ "$status" -ge 200 && "$status" -lt 400 ]]; then
            echo "Artifactory reachable with username/password; sample response:"
            head -c 800 /tmp/resp_up || true
            echo
          else
            echo "Response preview:"
            head -c 800 /tmp/resp_up || true
            echo
            echo "Failed to reach Artifactory with username/password (HTTP $status)" >&2
            echo "Possible causes: incorrect credentials, or the user lacks 'deploy' permission for 'altera-val-pypi-local/quark'." >&2
            exit 1
          fi

      - name: Configure Poetry repository
        if: ${{ steps.check-creds.outputs.can_publish == 'true' }}
        run: |
          poetry config repositories.jfrog https://ravik9026.jfrog.io/artifactory/altera-val-pypi-local

      - name: Configure Poetry auth (API token)
        if: ${{ steps.check-creds.outputs.use_api_key == 'true' }}
        env:
          ARTIFACTORY_API_KEY: ${{ secrets.ARTIFACTORY_API_KEY }}
        run: |
          poetry config http-basic.jfrog __token "${ARTIFACTORY_API_KEY}"

      - name: Configure Poetry auth (username/password)
        if: ${{ steps.check-creds.outputs.use_api_key == 'false' }}
        env:
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        run: |
          poetry config http-basic.jfrog "${ARTIFACTORY_USERNAME}" "${ARTIFACTORY_PASSWORD}"

      - name: Publish to JFrog (Poetry) — verbose
        if: ${{ steps.check-creds.outputs.can_publish == 'true' }}
        env:
          POETRY_VIRTUALENVS_CREATE: "false"
        run: |
          set -euo pipefail
          set -x
          echo "=== Poetry version and environment ==="
          poetry --version || true
          echo "=== Poetry config (all) ==="
          poetry config --list || true
          echo "=== Show Poetry config file (if exists) ==="
          cat "$HOME/.config/pypoetry/config.toml" || true

          echo "=== dist contents before publish ==="
          ls -la dist || true

          echo "=== Build wheel (explicit) ==="
          poetry build -f wheel || true

          echo "=== Running poetry publish (verbose) ==="
          poetry publish -r jfrog --build --no-interaction -vvv

      